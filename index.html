<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>箱子管家</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #f0b429;
    --text: #e8e8f0;
    --text2: #8888aa;
    --green: #4ade80;
    --red: #f87171;
    --blue: #60a5fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', sans-serif; min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -1px; white-space: nowrap; }
  .logo span { color: var(--text2); font-weight: 400; }
  .search-wrap { flex: 1; position: relative; max-width: 420px; }
  .search-wrap input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px; padding: 9px 16px 9px 38px; outline: none; transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 15px; }
  .header-stats { display: flex; gap: 18px; margin-left: auto; }
  .stat { text-align: center; white-space: nowrap; }
  .stat-val { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text2); }

  .tabs {
    display: flex; padding: 0 24px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: none; border: none; color: var(--text2); cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 500;
    padding: 12px 20px; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover { color: var(--text); }

  #search-results {
    background: var(--surface); border: 1px solid var(--accent); border-radius: 12px;
    padding: 14px 18px; margin: 14px 24px; display: none;
  }
  #search-results h3 { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
  .result-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .result-item:last-child { border-bottom: none; }
  .result-box-tag { background: var(--accent); color: #000; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .no-result { color: var(--text2); font-size: 14px; }

  main { padding: 20px 24px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .toolbar-hint { font-size: 13px; color: var(--text2); margin-right: auto; }
  .btn-tool {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); cursor: pointer; font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px; padding: 7px 14px; transition: border-color 0.2s, background 0.2s;
  }
  .btn-tool:hover { border-color: var(--accent); background: rgba(240,180,41,0.08); }
  .btn-tool.danger:hover { border-color: var(--red); background: rgba(248,113,113,0.08); color: var(--red); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

  .box-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color 0.2s, transform 0.15s; }
  .box-card:hover { border-color: #3e3e52; transform: translateY(-1px); }
  .box-card.has-items { border-color: #2e3a2e; }
  .card-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); }
  .box-num { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: var(--accent); background: rgba(240,180,41,0.12); padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
  .box-name-input { flex: 1; background: transparent; border: none; color: var(--text); font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 500; outline: none; }
  .box-name-input::placeholder { color: var(--text2); }
  .item-count { font-size: 11px; color: var(--text2); white-space: nowrap; }
  .item-count.has { color: var(--green); }
  .card-body { padding: 12px 14px; }
  .tag-input-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .tag-input-row input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: 'Noto Sans SC', sans-serif; font-size: 13px;
    padding: 7px 10px; outline: none; transition: border-color 0.2s;
  }
  .tag-input-row input:focus { border-color: var(--accent); }
  .tag-input-row input::placeholder { color: var(--text2); }
  .btn-add { background: var(--accent); border: none; border-radius: 6px; color: #000; cursor: pointer; font-size: 18px; font-weight: 700; padding: 0 12px; transition: background 0.15s; }
  .btn-add:hover { background: #ffc94d; }
  .items-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; }
  .item-tag {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); font-size: 12px; padding: 4px 8px;
    display: flex; align-items: center; gap: 5px; animation: pop 0.18s ease;
  }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .item-del { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; transition: color 0.15s; }
  .item-del:hover { color: var(--red); }
  .empty-hint { color: var(--text2); font-size: 12px; font-style: italic; }

  /* LOG PANEL */
  .log-toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .log-filter-group { display: flex; gap: 5px; }
  .filter-btn {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text2); cursor: pointer; font-family: 'Noto Sans SC', sans-serif;
    font-size: 12px; padding: 5px 12px; transition: all 0.2s;
  }
  .filter-btn.active { background: rgba(240,180,41,0.15); border-color: var(--accent); color: var(--accent); }
  .filter-btn.in.active { background: rgba(74,222,128,0.12); border-color: var(--green); color: var(--green); }
  .filter-btn.out.active { background: rgba(248,113,113,0.12); border-color: var(--red); color: var(--red); }
  .log-search {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: 'Noto Sans SC', sans-serif; font-size: 13px;
    padding: 6px 12px; outline: none; width: 180px; transition: border-color 0.2s;
  }
  .log-search:focus { border-color: var(--accent); }
  .log-clear { margin-left: auto; }
  .log-table { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .log-header {
    display: grid; grid-template-columns: 148px 68px 120px 1fr;
    padding: 10px 16px; background: var(--surface2); border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text2); font-weight: 500; letter-spacing: 0.04em;
  }
  .log-row {
    display: grid; grid-template-columns: 148px 68px 120px 1fr;
    padding: 11px 16px; border-bottom: 1px solid var(--border);
    font-size: 13px; align-items: center; transition: background 0.15s;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
  .log-row:last-child { border-bottom: none; }
  .log-row:hover { background: var(--surface2); }
  .log-time { color: var(--text2); font-family: 'Space Mono', monospace; font-size: 11px; }
  .log-type-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .log-type-badge.in { background: rgba(74,222,128,0.15); color: var(--green); }
  .log-type-badge.out { background: rgba(248,113,113,0.15); color: var(--red); }
  .log-box { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--accent); }
  .log-item { color: var(--text); }
  .log-empty { padding: 40px; text-align: center; color: var(--text2); font-size: 14px; }

  #save-indicator { position: fixed; bottom: 20px; right: 20px; background: var(--green); color: #000; font-size: 12px; font-weight: 700; padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #save-indicator.show { opacity: 1; }

  @media (max-width: 600px) {
    header { flex-wrap: wrap; }
    .header-stats { width: 100%; justify-content: flex-start; }
    main { padding: 12px 14px; }
    .log-header, .log-row { grid-template-columns: 100px 55px 90px 1fr; font-size: 11px; padding: 9px 10px; }
    .tabs { padding: 0 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">BOX<span>管家</span></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="搜索物品…" oninput="doSearch()">
  </div>
  <div class="header-stats">
    <div class="stat"><div class="stat-val" id="stat-boxes">20</div><div class="stat-label">箱子</div></div>
    <div class="stat"><div class="stat-val" id="stat-items">0</div><div class="stat-label">物品总数</div></div>
    <div class="stat"><div class="stat-val" id="stat-logs">0</div><div class="stat-label">操作记录</div></div>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('boxes')">📦 箱子管理</button>
  <button class="tab-btn" onclick="switchTab('log')">📋 出入记录</button>
</div>

<div id="search-results"></div>

<main>
  <div class="panel active" id="panel-boxes">
    <div class="toolbar">
      <span class="toolbar-hint">点击箱名可重命名 · 按 Enter 或 + 添加物品</span>
      <button class="btn-tool" onclick="addBox()">➕ 加箱子</button>
      <button class="btn-tool danger" onclick="removeLastBox()">➖ 减箱子</button>
      <button class="btn-tool" onclick="exportData()">📤 导出备份</button>
      <button class="btn-tool" onclick="importData()">📥 导入备份</button>
      <button class="btn-tool danger" onclick="clearAll()">🗑️ 清空全部</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="panel" id="panel-log">
    <div class="log-toolbar">
      <div class="log-filter-group">
        <button class="filter-btn active" data-filter="all" onclick="setLogFilter('all')">全部</button>
        <button class="filter-btn in" data-filter="in" onclick="setLogFilter('in')">📥 存入</button>
        <button class="filter-btn out" data-filter="out" onclick="setLogFilter('out')">📤 取出</button>
      </div>
      <input class="log-search" type="text" placeholder="搜索物品或箱子…" oninput="renderLog()">
      <button class="btn-tool danger log-clear" onclick="clearLog()">清空记录</button>
    </div>
    <div id="log-container"></div>
  </div>
</main>

<div id="save-indicator">已自动保存 ✓</div>
<input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const TOTAL = 20;
const KEY = 'boxManager_v2';
let logFilter = 'all';

function loadData() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  const boxes = [];
  for (let i = 1; i <= TOTAL; i++) boxes.push({ id: i, name: '箱子 ' + i, items: [] });
  return { boxes, log: [] };
}

let data = loadData();
if (!data.log) data.log = [];
let saveTimer = null;

function save() {
  localStorage.setItem(KEY, JSON.stringify(data));
  const ind = document.getElementById('save-indicator');
  ind.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => ind.classList.remove('show'), 1400);
  updateStats();
}

function updateStats() {
  const total = data.boxes.reduce((s, b) => s + b.items.length, 0);
  document.getElementById('stat-boxes').textContent = data.boxes.length;
  document.getElementById('stat-items').textContent = total;
  document.getElementById('stat-logs').textContent = data.log.length;
}

function addLog(type, boxId, boxName, itemName) {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const timeStr = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) +
    ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  data.log.unshift({ time: timeStr, type, boxId, boxName, item: itemName });
  if (data.log.length > 500) data.log.length = 500;
}

function switchTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  document.querySelectorAll('.tab-btn')[tab === 'boxes' ? 0 : 1].classList.add('active');
  if (tab === 'log') renderLog();
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  data.boxes.forEach(box => {
    const card = document.createElement('div');
    card.className = 'box-card' + (box.items.length ? ' has-items' : '');
    card.dataset.id = box.id;
    card.innerHTML =
      '<div class="card-header">' +
        '<span class="box-num">#' + String(box.id).padStart(2,'0') + '</span>' +
        '<input class="box-name-input" value="' + esc(box.name) + '" placeholder="箱子名称…"' +
          ' onchange="renameBox(' + box.id + ', this.value)"' +
          ' onkeydown="if(event.key===\'Enter\')this.blur()">' +
        '<span class="item-count ' + (box.items.length ? 'has' : '') + '">' + box.items.length + ' 件</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="tag-input-row">' +
          '<input type="text" placeholder="输入物品名…" id="inp-' + box.id + '"' +
            ' onkeydown="if(event.key===\'Enter\')addItem(' + box.id + ')">' +
          '<button class="btn-add" onclick="addItem(' + box.id + ')">+</button>' +
        '</div>' +
        '<div class="items-list" id="list-' + box.id + '">' + renderItems(box) + '</div>' +
      '</div>';
    grid.appendChild(card);
  });
  updateStats();
}

function renderItems(box) {
  if (!box.items.length) return '<span class="empty-hint">（空箱子）</span>';
  return box.items.map((item, i) =>
    '<span class="item-tag">' + esc(item) +
    '<button class="item-del" title="取出物品" onclick="removeItem(' + box.id + ',' + i + ')">×</button></span>'
  ).join('');
}

function refreshCard(boxId) {
  const box = data.boxes.find(b => b.id === boxId);
  const card = document.querySelector('.box-card[data-id="' + boxId + '"]');
  if (!card || !box) return;
  card.className = 'box-card' + (box.items.length ? ' has-items' : '');
  card.querySelector('.item-count').textContent = box.items.length + ' 件';
  card.querySelector('.item-count').className = 'item-count' + (box.items.length ? ' has' : '');
  card.querySelector('#list-' + boxId).innerHTML = renderItems(box);
}

function addItem(boxId) {
  const inp = document.getElementById('inp-' + boxId);
  const val = inp.value.trim();
  if (!val) return;
  const box = data.boxes.find(b => b.id === boxId);
  val.split(/[,，、]/).map(s => s.trim()).filter(Boolean).forEach(v => {
    if (!box.items.includes(v)) {
      box.items.push(v);
      addLog('in', box.id, box.name, v);
    }
  });
  inp.value = '';
  refreshCard(boxId);
  save();
}

function removeItem(boxId, idx) {
  const box = data.boxes.find(b => b.id === boxId);
  const item = box.items[idx];
  addLog('out', box.id, box.name, item);
  box.items.splice(idx, 1);
  refreshCard(boxId);
  save();
}

function renameBox(boxId, name) {
  const box = data.boxes.find(b => b.id === boxId);
  box.name = name || ('箱子 ' + boxId);
  save();
}

function setLogFilter(f) {
  logFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderLog();
}

function renderLog() {
  const q = (document.querySelector('.log-search') ? document.querySelector('.log-search').value : '').trim().toLowerCase();
  let entries = data.log;
  if (logFilter !== 'all') entries = entries.filter(e => e.type === logFilter);
  if (q) entries = entries.filter(e =>
    e.item.toLowerCase().includes(q) ||
    e.boxName.toLowerCase().includes(q) ||
    String(e.boxId).includes(q)
  );
  const container = document.getElementById('log-container');
  if (!entries.length) {
    container.innerHTML = '<div class="log-table"><div class="log-empty">暂无记录' + (q ? '（搜索无结果）' : '') + '</div></div>';
    return;
  }
  let rows = entries.map(e =>
    '<div class="log-row">' +
      '<div class="log-time">' + esc(e.time) + '</div>' +
      '<div><span class="log-type-badge ' + e.type + '">' + (e.type === 'in' ? '📥 存入' : '📤 取出') + '</span></div>' +
      '<div class="log-box">#' + String(e.boxId).padStart(2,'0') + ' ' + esc(e.boxName) + '</div>' +
      '<div class="log-item">' + (q ? highlight(e.item, q) : esc(e.item)) + '</div>' +
    '</div>'
  ).join('');
  container.innerHTML =
    '<div class="log-table">' +
      '<div class="log-header"><div>时间</div><div>类型</div><div>箱子</div><div>物品</div></div>' +
      rows +
    '</div>';
}

function clearLog() {
  if (!confirm('确定要清空所有出入记录吗？')) return;
  data.log = [];
  save();
  renderLog();
}

function doSearch() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const panel = document.getElementById('search-results');
  if (!q) { panel.style.display = 'none'; return; }
  const results = [];
  data.boxes.forEach(box => {
    box.items.forEach(item => {
      if (item.toLowerCase().includes(q)) results.push({ box, item });
    });
  });
  panel.style.display = 'block';
  if (!results.length) {
    panel.innerHTML = '<h3>搜索结果</h3><p class="no-result">没有找到「' + q + '」</p>';
    return;
  }
  panel.innerHTML = '<h3>找到 ' + results.length + ' 条结果</h3>' +
    results.map(r =>
      '<div class="result-item">' +
        '<span class="result-box-tag">#' + String(r.box.id).padStart(2,'0') + '</span>' +
        '<span>' + esc(r.box.name) + '</span>' +
        '<span style="color:var(--text2)">›</span>' +
        '<span>' + highlight(r.item, q) + '</span>' +
      '</div>'
    ).join('');
}

function highlight(text, q) {
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return esc(text).replace(re, '<mark style="background:var(--accent);color:#000;border-radius:2px;padding:0 2px">$1</mark>');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '箱子管家备份_' + new Date().toLocaleDateString('zh') + '.json';
  a.click();
}
function importData() { document.getElementById('import-file').click(); }
function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (imported.boxes && Array.isArray(imported.boxes)) {
        data = imported;
        if (!data.log) data.log = [];
        save(); render(); renderLog();
        alert('导入成功！');
      } else { alert('文件格式不对，请使用本应用导出的备份文件。'); }
    } catch { alert('读取失败，文件可能损坏。'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function addBox() {
  const maxId = data.boxes.reduce((m, b) => Math.max(m, b.id), 0);
  const newId = maxId + 1;
  data.boxes.push({ id: newId, name: '箱子 ' + newId, items: [] });
  save(); render();
  // scroll to new card
  setTimeout(() => {
    const card = document.querySelector('.box-card[data-id="' + newId + '"]');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function removeLastBox() {
  if (data.boxes.length <= 1) { alert('至少保留一个箱子！'); return; }
  const last = data.boxes[data.boxes.length - 1];
  const msg = last.items.length
    ? '箱子 #' + String(last.id).padStart(2,'0') + '「' + last.name + '」还有 ' + last.items.length + ' 件物品，确定要删除吗？'
    : '确定删除最后一个箱子「' + last.name + '」吗？';
  if (!confirm(msg)) return;
  data.boxes.pop();
  save(); render();
}

function clearAll() {
  if (!confirm('确定要清空所有箱子内容吗？此操作无法撤销！')) return;
  data.boxes.forEach(b => { b.items = []; b.name = '箱子 ' + b.id; });
  save(); render();
}

render();
updateStats();
</script>
